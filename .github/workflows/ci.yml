name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # Lint and Typecheck
  # ============================================
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build MCP package (workers import it for /mcp)
        run: pnpm --filter abundai-mcp build

      - name: Run linting
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Frontend unit tests (markdown sanitiser XSS corpus)
        run: pnpm --filter frontend test

      - name: OpenAPI <-> routes parity
        run: pnpm --filter @abund/workers test:parity

      - name: MCP OpenAPI snapshot is current
        run: |
          pnpm --filter abundai-mcp gen
          git diff --exit-code packages/mcp/src/generated

      - name: Skill docs are in sync
        run: node scripts/sync-skill.mjs --check

  # ============================================
  # E2E Tests (Playwright)
  # ============================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Create wrangler config for CI
        run: cp workers/wrangler.toml.example workers/wrangler.toml

      - name: Build MCP package (workers import it for /mcp)
        run: pnpm --filter abundai-mcp build

      - name: Reset database
        run: pnpm db:reset

      - name: Start development servers
        run: |
          pnpm dev &
          # Wait for servers to be ready
          sleep 20
          # Check if servers are up
          curl --retry 15 --retry-delay 3 --retry-connrefused http://localhost:3000 || exit 1
          curl --retry 15 --retry-delay 3 --retry-connrefused http://localhost:8787/api/v1/posts || exit 1

      - name: Run API E2E tests
        run: pnpm test:e2e -- --project=api
        env:
          CI: true

      - name: Run browser E2E tests
        run: pnpm test:e2e -- --project=chromium
        env:
          CI: true

      - name: MCP stdio smoke test against the local API
        run: pnpm --filter abundai-mcp test
        env:
          API_URL: http://localhost:8787/api/v1

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-screenshots
          path: e2e/test-results/
          retention-days: 7

  # ============================================
  # Build Check
  # ============================================
  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build MCP package
        run: pnpm --filter abundai-mcp build

      - name: Build frontend
        run: pnpm --filter frontend build

      # The server bundle ships to a Cloudflare Worker, which caps at 1 MiB
      # gzipped on the free plan (3 MiB paid). React 19 SSR plus highlight.js,
      # marked and three locale files leave real headroom but not unlimited -
      # catching growth in a PR beats catching it on deploy day.
      - name: Check Worker bundle size
        run: |
          test -f frontend/build/server/index.js || {
            echo "::error::frontend/build/server/index.js missing - the SSR build did not run"
            exit 1
          }
          test -d frontend/build/client || {
            echo "::error::frontend/build/client missing - the client build did not run"
            exit 1
          }
          SIZE=$(gzip -c frontend/build/server/index.js | wc -c | tr -d ' ')
          LIMIT=920000
          echo "SSR bundle: $SIZE bytes gzipped (limit $LIMIT)"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::SSR bundle is $SIZE bytes gzipped, over the $LIMIT budget and approaching the 1 MiB Worker limit"
            exit 1
          fi
